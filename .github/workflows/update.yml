name: Update

on:
  workflow_dispatch:
    inputs:
      fullImage:
        description: Rebuild all exported images
        type: boolean
        default: false
      fullHitSource:
        description: Rebuild all hit source data
        type: boolean
        default: false
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: update-assets
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build extractor
        run: dotnet build tools/Extract -c Release

      - name: Install dependencies
        run: pnpm install --prod

      - name: Install MiSans font
        run: |
          mkdir -p ~/.local/share/fonts
          cp font/MiSansLatin-Semibold.ttf ~/.local/share/fonts/
          fc-cache -f
          match="$(fc-match -f '%{family}' 'MiSans Latin SemiBold')"
          echo "resolved font: $match"
          grep -qi 'MiSans Latin' <<< "$match" \
            || { echo "::error::MiSans Latin font did not resolve"; exit 1; }

      - name: Download ResourceFetcher
        run: |
          FETCHER_VERSION=v0.4.3
          FETCHER_DIR="$RUNNER_TEMP/resourcefetcher"
          mkdir -p "$FETCHER_DIR"
          curl -fsSL "https://github.com/MakoStar/ss-resource-fetcher/releases/download/$FETCHER_VERSION/ResourceFetcher-$FETCHER_VERSION-linux-x64.tar.gz" \
            | tar -xz -C "$FETCHER_DIR"
          chmod +x "$FETCHER_DIR/ResourceFetcher"

      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: ResourceTool/output
          key: resource-default
          restore-keys: resource-

      - name: Restore exported bundle cache
        uses: actions/cache/restore@v6
        with:
          path: diff-resource
          key: diff-resource-default
          restore-keys: diff-resource-

      - name: Sync persistent store
        working-directory: ResourceTool
        run: '"$RUNNER_TEMP/resourcefetcher/ResourceFetcher" client'

      - name: Remove stale unpacked bundles
        run: node cleanUnpack.js

      - name: Diff bundles
        run: node resourceDiff.js

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(ls -A diff_out 2>/dev/null)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed bundles"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check hit source data
        id: hitSource
        run: |
          if [ ! -f hitSource.json ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export changed bundles
        if: steps.check.outputs.changed == 'true' && inputs.fullImage != true
        run: node export.js diff_out

      - name: Export full image bundles
        if: inputs.fullImage == true
        run: node export.js

      - name: Generate hit source data
        if: steps.check.outputs.changed == 'true' && inputs.fullHitSource != true && steps.hitSource.outputs.missing != 'true'
        run: node hitSource.js diff_out

      - name: Generate full hit source data
        if: inputs.fullHitSource == true || steps.hitSource.outputs.missing == 'true'
        run: node hitSource.js

      - name: Compose potential images
        if: steps.check.outputs.changed == 'true' || inputs.fullImage == true
        run: node sharp.js

      - name: Update exported bundle cache
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p diff-resource
          cp diff-manifest.json diff-resource/manifest.json

      - name: Commit and push
        if: steps.check.outputs.changed == 'true' || inputs.fullHitSource == true || inputs.fullImage == true || steps.hitSource.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          VERSION_JSON="ResourceTool/output/Manifest/win_version.json"
          GAME_VER=$(node -e "const v=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log(v.EN.game_ver)" "$VERSION_JSON")
          echo "game version: $GAME_VER"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update $GAME_VER"
            git push

            if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
              curl -s -o /dev/null -w "%{http_code}" -d "" "${{ secrets.DEPLOY_HOOK_URL }}"
            else
              echo "No deploy hook URL configured"
            fi
          fi

      - name: Save exported bundle cache
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: diff-resource
          key: diff-resource-${{ github.run_id }}

      - name: Save cache
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ResourceTool/output
          key: resource-${{ hashFiles('ResourceTool/output/Manifest/win_version.json') }}
