name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout ss-resource-fetcher
        uses: actions/checkout@v6
        with:
          repository: MakoStar/ss-resource-fetcher
          path: ss-tools
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ss-tools/target
          key: cargo-${{ hashFiles('ss-tools/Cargo.lock') }}
          restore-keys: cargo-

      - name: Build release
        working-directory: ss-tools
        run: cargo build -p ss-resource-fetcher --release

      - name: Commit ResourceFetcher.exe
        run: |
          mkdir -p ResourceTool
          cp ss-tools/target/release/ResourceFetcher.exe ResourceTool/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ResourceTool/ResourceFetcher.exe
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update ResourceFetcher"
            git push
          fi
